<div>

    <form action="/logout/" method="POST">
        {% csrf_token %}
    <button type="submit">Logout</button>
    </form>
    
    {%for product in products%}
        <div>
            <p>{{product.title}}</p>
            <small>{{product.description}}</small>
            <p>${{product.price}}</p>
        </div>
    {%endfor%}


</div>
